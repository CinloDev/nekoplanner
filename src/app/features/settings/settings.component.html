<div class="settings-container">
  <div class="settings-header">
    <h2>Ajustes</h2>
    <p>Personaliza tu experiencia en NekoPlanner.</p>
  </div>

  <app-card>
    <div class="settings-section">
      <div class="section-header">
        <h3>Apariencia</h3>
        <p>Configura cómo se ve la interfaz de la aplicación.</p>
      </div>

      <div class="setting-item">
        <div class="setting-label">Tema</div>
        <div class="setting-control">
          <app-select
            label="Tema de la aplicación"
            placeholder="Seleccionar tema"
            [options]="themeOptions"
            [value]="themeService.preference()"
            (valueChange)="onThemeChange($event)">
          </app-select>
        </div>
      </div>
    </div>
  </app-card>

  <app-card>
    <div class="settings-section">
      <div class="section-header">
        <h3>Datos</h3>
        <p>Gestiona la información de NekoPlanner.</p>
      </div>

      <div class="setting-item">
        <div class="setting-label">Exportar datos</div>
        <div class="setting-control">
          <app-button variant="primary" (click)="exportData()">
            Exportar Backup
          </app-button>
        </div>
      </div>

      <div class="setting-item">
        <div class="setting-label">Importar datos</div>
        <div class="setting-control import-control">
          <input 
            type="file" 
            accept=".json" 
            #fileInput 
            style="display: none" 
            (change)="onFileSelected($event)">
          <app-button variant="secondary" (click)="fileInput.click()">
            Importar backup
          </app-button>
        </div>
      </div>
      
      @if (importError) {
        <div class="import-error-banner">
          {{ importError }}
        </div>
      }
    </div>
  </app-card>
</div>

<app-confirm-dialog
  [isOpen]="isConfirmDialogOpen"
  title="Importar datos"
  [message]="confirmMessage"
  confirmText="Importar datos"
  (confirm)="onConfirmImport()"
  (cancel)="onCancelImport()">
</app-confirm-dialog>
