<div class="settings-container">
  <div class="settings-header">
    <h2>Ajustes</h2>
    <p>Personaliza tu experiencia en NekoPlanner.</p>
  </div>

  <app-card>
    <div class="settings-section">
      <div class="section-header">
        <h3>Apariencia</h3>
        <p>Configura cómo se ve la interfaz de la aplicación.</p>
      </div>

      <div class="setting-item">
        <div class="setting-label">Tema</div>
        <div class="setting-control">
          <app-select
            label="Tema de la aplicación"
            placeholder="Seleccionar tema"
            [options]="themeOptions"
            [value]="themeService.preference()"
            (valueChange)="onThemeChange($event)">
          </app-select>
        </div>
      </div>
    </div>
  </app-card>

  <app-card>
    <div class="settings-section">
      <div class="section-header">
        <h3>Datos</h3>
        <p>Gestiona la información de NekoPlanner.</p>
      </div>

      <div class="setting-item">
        <div class="setting-label">Exportar datos</div>
        <div class="setting-control">
          <app-button variant="primary" (clicked)="exportData()">
            Exportar Backup
          </app-button>
        </div>
      </div>
    </div>
  </app-card>
</div>
