<div class="calendar-container">
  
  <app-calendar-header
    [currentMonth]="currentMonth()"
    (previous)="goToPreviousMonth()"
    (next)="goToNextMonth()"
    (today)="goToToday()">
  </app-calendar-header>

  <app-calendar-grid>
    @for (cell of gridData(); track cell.date.toISOString()) {
      <app-calendar-day
        [date]="cell.date"
        [referenceMonth]="currentMonth()"
        [today]="todayDate"
        [posts]="cell.posts">
      </app-calendar-day>
    }
  </app-calendar-grid>

  @if (!hasAnyPosts) {
    <div class="empty-state">
      <p>No hay publicaciones programadas. ¡Empezá a planificar tu contenido!</p>
    </div>
  }

</div>
