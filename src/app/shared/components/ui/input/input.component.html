<div class="input-container" [class.is-disabled]="disabled()" [class.has-error]="error()">
  @if (label()) {
    <label class="input-label" [attr.for]="'input-' + type() + '-' + label()">
      {{ label() }}
    </label>
  }
  
  <div class="input-wrapper">
    <input
      [id]="label() ? 'input-' + type() + '-' + label() : null"
      class="input-control"
      [type]="type()"
      [placeholder]="placeholder()"
      [value]="value()"
      [disabled]="disabled()"
      [attr.aria-invalid]="!!error()"
      (input)="onInput($event)"
    />
  </div>

  @if (error()) {
    <span class="input-error" role="alert">{{ error() }}</span>
  }
</div>
