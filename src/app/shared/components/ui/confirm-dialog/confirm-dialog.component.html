@if (isOpen()) {
  <div class="dialog-backdrop" (click)="onBackdropClick()"></div>
  <div 
    class="confirm-dialog" 
    role="alertdialog" 
    aria-modal="true" 
    aria-labelledby="dialog-title" 
    aria-describedby="dialog-message"
    cdkTrapFocus 
    [cdkTrapFocusAutoCapture]="true"
    (click)="onDialogClick($event)">
    
    <div class="dialog-content">
      <div class="icon-container" [class.destructive]="isDestructive()">
        <lucide-icon [img]="isDestructive() ? AlertTriangle : Info" size="28"></lucide-icon>
      </div>
      <h2 id="dialog-title">{{ title() }}</h2>
      <p id="dialog-message">{{ message() }}</p>
    </div>
    
    <div class="dialog-actions">
      <app-button variant="secondary" (click)="onCancel()" class="action-btn">
        {{ cancelText() }}
      </app-button>
      <app-button 
        [variant]="isDestructive() ? 'danger' : 'primary'" 
        (click)="onConfirm()"
        class="action-btn">
        {{ confirmText() }}
      </app-button>
    </div>
  </div>
}
