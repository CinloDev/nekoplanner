<nav class="mobile-nav" aria-label="Mobile Navigation">
  <ul>
    <li *ngFor="let item of navItems">
      <a [routerLink]="item.route" 
         routerLinkActive="active" 
         class="mobile-nav-link">
        <!-- Optional Icon Slot -->
        <span class="mobile-nav-label">{{ item.label }}</span>
      </a>
    </li>
  </ul>
</nav>
