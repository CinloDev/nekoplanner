<aside class="sidebar">
  <div class="brand">
    <span class="brand-text">NekoPlanner</span>
  </div>

  <nav class="nav-menu" aria-label="Main Navigation">
    <ul>
      <li *ngFor="let item of navItems">
        <a [routerLink]="item.route" 
           routerLinkActive="active" 
           class="nav-link">
          <span class="nav-label">{{ item.label }}</span>
        </a>
      </li>
    </ul>
  </nav>
</aside>
